name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 1. 테스트 작업: 3가지 OS에서 테스트 실행
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Linux에서 PySide6 GUI 테스트를 위한 시스템 라이브러리 및 가상 디스플레이 설치
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb

    - name: Run Tests
      shell: bash
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          xvfb-run pytest
        else
          pytest
        fi

  # 2. 빌드 작업: 테스트 통과 시 실행 파일 생성 (Windows, macOS)
  build:
    needs: test
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TRPG_Converter_Pro_Windows
            asset_name: TRPG_Converter_Pro.exe
          - os: macos-latest
            artifact_name: TRPG_Converter_Pro_macOS
            asset_name: TRPG_Converter_Pro.app

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    # Windows 빌드
    - name: Build with PyInstaller (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --name="TRPG_Converter_Pro" --windowed --onefile --clean main.py

    # macOS 빌드 (앱 번들 생성 후 zip 압축)
    - name: Build with PyInstaller (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        pyinstaller --name="TRPG_Converter_Pro" --windowed --clean --noconfirm main.py
        cd dist
        zip -r TRPG_Converter_Pro_macOS.zip TRPG_Converter_Pro.app

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/

  # 3. 릴리스 작업: 태그 푸시 시 GitHub Release 생성
  release:
    needs: build
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: TRPG_Converter_Pro_Windows
        path: artifacts/windows

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: TRPG_Converter_Pro_macOS
        path: artifacts/macos

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          artifacts/windows/TRPG_Converter_Pro.exe
          artifacts/macos/TRPG_Converter_Pro_macOS.zip
