name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 ebooklib python-docx beautifulsoup4 lxml pyyaml pillow reportlab pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name TRPG_Converter_Pro `
            --windowed `
            --onedir `
            --clean `
            --noconfirm `
            --add-data "core;core" `
            --add-data "gui;gui" `
            --add-data "utils;utils" `
            --add-data "config.yaml;." `
            --hidden-import PySide6 `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import ebooklib `
            --hidden-import bs4 `
            --hidden-import lxml `
            --hidden-import docx `
            --hidden-import yaml `
            --hidden-import PIL `
            --hidden-import reportlab `
            main.py

      - name: Create ZIP
        run: Compress-Archive -Path dist\TRPG_Converter_Pro -DestinationPath dist\TRPG_Converter_Pro_Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRPG_Converter_Pro_Windows
          path: dist/TRPG_Converter_Pro_Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 ebooklib python-docx beautifulsoup4 lxml pyyaml pillow reportlab pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --name TRPG_Converter_Pro \
            --windowed \
            --onedir \
            --clean \
            --noconfirm \
            --add-data "core:core" \
            --add-data "gui:gui" \
            --add-data "utils:utils" \
            --add-data "config.yaml:." \
            --hidden-import PySide6 \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import ebooklib \
            --hidden-import bs4 \
            --hidden-import lxml \
            --hidden-import docx \
            --hidden-import yaml \
            --hidden-import PIL \
            --hidden-import reportlab \
            --osx-bundle-identifier com.trpg.converter \
            main.py

      - name: Create ZIP
        run: cd dist && zip -r TRPG_Converter_Pro_macOS.zip TRPG_Converter_Pro.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TRPG_Converter_Pro_macOS
          path: dist/TRPG_Converter_Pro_macOS.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: TRPG_Converter_Pro_Windows
          path: ./

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: TRPG_Converter_Pro_macOS
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            TRPG_Converter_Pro_Windows.zip
            TRPG_Converter_Pro_macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
