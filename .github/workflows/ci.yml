name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs of the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ─── Static analysis ─────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check core/ gui/ tests/ --output-format=github
      - run: ruff format --check core/ gui/ tests/

  type:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .[dev]
      - run: mypy core gui

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # bandit 1.7.5+ 부터 pyproject.toml 의 [tool.bandit] 을 자동 인식하지 못해
      # ``-c pyproject.toml`` 로 명시 지정. 우리 skips 리스트는 거기서 관리.
      - run: pip install "bandit[toml]"
      - run: bandit -r core/ -s B101 -ll -c pyproject.toml

  # ─── Tests ───────────────────────────────────────────────────────────
  test:
    name: Test (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          # Trim matrix: only run the full Python range on Linux.
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install Linux GUI libs
        if: runner.os == 'Linux'
        # Qt 6.5+ 추가 의존성: libxcb-cursor0 / libgl1 / libfontconfig1.
        # libegl 만으로는 platform plugin 'xcb' 가 동적 로딩 단계에서 죽어
        # SIGABRT (exit 134) 가 발생. 다 박아 넣어 offscreen 모드의 폴백도 안전.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libfontconfig1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-cursor0 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-xfixes0 x11-utils xvfb

      - name: Run pytest with coverage gate
        shell: bash
        # Linux 에서만 Qt 의 xcb 플랫폼 플러그인 동적 로딩이 위태로워 SIGABRT
        # (exit 134) 가 나므로 ``QT_QPA_PLATFORM=offscreen`` 으로 display 의존을
        # 우회한다. Windows/macOS 는 native Qt platform plugin (windows / cocoa)
        # 이 정상 동작하고, 같은 offscreen 설정을 거기 강제하면 qfluentwidgets
        # 등 일부 widget 이 access violation (exit 139) 으로 죽어서 OS 별 분기.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            QT_QPA_PLATFORM=offscreen xvfb-run -a pytest --cov=core --cov-report=term-missing --cov-report=xml
          else
            pytest --cov=core --cov-report=term-missing --cov-report=xml
          fi

      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ─── Build artefacts ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [test, type]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TRPG_Converter_Pro_Windows
          - os: macos-latest
            artifact: TRPG_Converter_Pro_macOS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # Inno Setup for the Windows installer. innosetup is pre-installed on
      # most windows-latest runners but we add it via Chocolatey for safety.
      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          } else { Write-Host "ISCC already present" }

      # create-dmg for a polished macOS DMG with layout. Falls back to hdiutil
      # if Homebrew lookup fails (which is fine — DMG still works).
      - name: Install create-dmg (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install create-dmg || true

      - name: Run build script
        run: python scripts/build.py

      # Both installers and zip are produced. The zip is for users who prefer
      # the portable mode; the installer is the recommended path.
      - name: Package macOS bundle (zip + dmg)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r TRPG_Converter_Pro_macOS.zip TRPG_Converter_Pro.app

      - name: Package Windows folder (zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\TRPG_Converter_Pro `
            -DestinationPath dist\TRPG_Converter_Pro_Windows.zip

      - name: Upload artifact (zip + installer)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/installer/*.exe
            dist/installer/*.dmg
          if-no-files-found: warn

  # ─── Release on tag push ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.dmg
